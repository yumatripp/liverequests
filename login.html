<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Requests - Login</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <style>
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#0a0b0f;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .box{
      background:#12141b;
      padding:30px;
      border-radius:16px;
      width:320px;
      text-align:center;
    }
    input{
      width:100%;
      margin:10px 0;
      padding:10px;
      border-radius:8px;
      border:none;
    }
    button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      background:#3ddc84;
      font-weight:bold;
      cursor:pointer;
    }
    .msg{
      margin-top:10px;
      padding:10px;
      border-radius:8px;
      display:none;
    }
    .err{background:#441b1b;}
    .ok{background:#1b4426;}
  </style>
</head>
<body>

<div class="box">
  <h2>Live Requests</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn">Login</button>
  <button id="signupBtn">Create Account</button>
  <button id="resetBtn">Reset Password</button>

  <div id="msg" class="msg"></div>
</div>

<script>
// 🔴 PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "AIzaSyBPM9sZnzGxHacIaCRuD1abDxygwYBU2qM",
  authDomain: "live-requests-73c57.firebaseapp.com",
  projectId: "live-requests-73c57",
  appId: "1:1028183935413:web:56f8794bf60d2e9c4cb1fc"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const msg = document.getElementById("msg");

function show(message, ok=false){
  msg.textContent = message;
  msg.className = "msg " + (ok ? "ok" : "err");
  msg.style.display = "block";
}

function clearMsg(){
  msg.style.display = "none";
}

// 🔐 SIGNUP
document.getElementById("signupBtn").addEventListener("click", async ()=>{
  clearMsg();

  const email = emailInput();
  const password = passwordInput();

  try{
    const userCredential = await auth.createUserWithEmailAndPassword(email, password);

    try{
      await userCredential.user.sendEmailVerification();
      show("Account created! Check your email to verify.", true);
    }catch(err){
      console.error("EMAIL ERROR:", err);
      show("Account created, but email failed: " + err.message);
      return;
    }

    await auth.signOut();

  }catch(e){
    show(e.message);
  }
});

// 🔐 LOGIN
document.getElementById("loginBtn").addEventListener("click", async ()=>{
  clearMsg();

  try{
    const userCredential = await auth.signInWithEmailAndPassword(
      emailInput(),
      passwordInput()
    );

    if(!userCredential.user.emailVerified){
      show("Please verify your email before logging in.");
      await auth.signOut();
      return;
    }

    window.location.href = "dj.html";

  }catch(e){
    show(e.message);
  }
});

// 🔁 RESET PASSWORD
document.getElementById("resetBtn").addEventListener("click", async ()=>{
  clearMsg();

  const email = emailInput();

  if(!email){
    show("Enter your email first.");
    return;
  }

  try{
    await auth.sendPasswordResetEmail(email);
    show("Password reset email sent.", true);
  }catch(e){
    show(e.message);
  }
});

// helpers
function emailInput(){
  return document.getElementById("email").value.trim();
}
function passwordInput(){
  return document.getElementById("password").value;
}

// auto redirect if already verified
auth.onAuthStateChanged(user=>{
  if(user && user.emailVerified){
    window.location.href = "dj.html";
  }
});
</script>

</body>
</html>
