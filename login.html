<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Requests - Login</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <style>
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#090a0d,#0f1218 40%,#0c0f15);
      color:#f3f5fb;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:18px;
    }
    .box{
      width:100%;
      max-width:380px;
      background:#12141b;
      border:1px solid #252938;
      border-radius:18px;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
      padding:24px;
    }
    h1{
      margin:0 0 8px;
      font-size:28px;
    }
    p{
      margin:0 0 16px;
      color:#9ba3b7;
      font-size:14px;
      line-height:1.5;
    }
    input{
      width:100%;
      box-sizing:border-box;
      border:1px solid #2a3040;
      background:#0f1219;
      color:#f3f5fb;
      border-radius:12px;
      padding:12px 13px;
      font-size:15px;
      outline:none;
      margin-bottom:10px;
    }
    button{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      font-size:14px;
      font-weight:700;
      border:none;
      cursor:pointer;
      margin-top:8px;
    }
    .primary{
      background:#3ddc84;
      color:#08100b;
    }
    .ghost{
      background:#1a1f2a;
      color:#f3f5fb;
      border:1px solid #2c3345;
    }
    .msg{
      margin-top:12px;
      padding:12px 13px;
      border-radius:12px;
      font-size:14px;
      display:none;
      line-height:1.5;
    }
    .err{
      background:#29161a;
      color:#ffb1b1;
      border:1px solid #5e2c35;
    }
    .ok{
      background:#0f1b14;
      color:#bff7d5;
      border:1px solid #246943;
    }
    .small{
      font-size:12px;
      color:#9ba3b7;
      margin-top:12px;
      line-height:1.5;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Live Requests</h1>
    <p>Create an account or log in to manage your own events.</p>

    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />

    <button class="primary" id="loginBtn" type="button">Log In</button>
    <button class="ghost" id="signupBtn" type="button">Create Account</button>
    <button class="ghost" id="resetBtn" type="button">Reset Password</button>

    <div id="msg" class="msg"></div>

    <div class="small">
      Paste your Firebase values into the <code>firebaseConfig</code> block below before uploading.
    </div>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBPM9sZnzGxHacIaCRuD1abDxygwYBU2qM",
  authDomain: "live-requests-73c57.firebaseapp.com",
  projectId: "live-requests-73c57",
  appId: "1:1028183935413:web:56f8794bf60d2e9c4cb1fc"
};

const msg = document.getElementById("msg");

function show(message, ok = false) {
  msg.textContent = message;
  msg.className = "msg " + (ok ? "ok" : "err");
  msg.style.display = "block";
}

function hideMessage() {
  msg.style.display = "none";
}

let auth = null;

try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();

  auth.onAuthStateChanged((user) => {
    if (user && user.emailVerified) {
      window.location.href = "dj.html";
    }
  });
} catch (e) {
  show("Paste your Firebase values into login.html first.");
}

document.getElementById("signupBtn").addEventListener("click", async () => {
  hideMessage();
  if (!auth) return;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const userCredential = await auth.createUserWithEmailAndPassword(email, password);

    await userCredential.user.sendEmailVerification();

    show("Account created. Check your email and click the verification link before logging in.", true);

    await auth.signOut();
  } catch (e) {
    show(e.message);
  }
});

document.getElementById("loginBtn").addEventListener("click", async () => {
  hideMessage();
  if (!auth) return;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const userCredential = await auth.signInWithEmailAndPassword(email, password);

    if (!userCredential.user.emailVerified) {
      show("Please verify your email before logging in.");
      await auth.signOut();
      return;
    }

    window.location.href = "dj.html";
  } catch (e) {
    show(e.message);
  }
});

document.getElementById("resetBtn").addEventListener("click", async () => {
  hideMessage();
  if (!auth) return;

  const email = document.getElementById("email").value.trim();

  if (!email) {
    show("Enter your email first, then click Reset Password.");
    return;
  }

  try {
    await auth.sendPasswordResetEmail(email);
    show("Password reset email sent.", true);
  } catch (e) {
    show(e.message);
  }
});
</script>
</body>
</html>
